<svg xmlns="http://www.w3.org/2000/svg"
     width="1180" height="610" viewBox="0 0 1180 610"
     role="img"
     aria-label="Aakash Singh — M.Tech CSE Student · AI/ML Engineer · Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        values="0 .5 .5; 360 .5 .5" dur="28s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset=".5" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#059669"/>
      <animate attributeName="x1" values="0;0.35;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#06B6D4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748B" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
    <clipPath id="leftClip"><rect x="34" y="92" width="430" height="474" rx="22"/></clipPath>
    <style>
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
      .muted { fill:#64748B; }
      .text { fill:#0F172A; }
      .cyan { fill:#0891B2; }
      .violet { fill:#6D28D9; }
      .green { fill:#047857; }
      .tiny { font-size:11px; letter-spacing:1.7px; }
      .label { font-size:12px; letter-spacing:1.1px; }
      .value { font-size:15px; }
    </style>
  </defs>

  <rect x="3" y="3" width="1174" height="604" rx="26" fill="url(#bg)" stroke="#CBD5E1"/>
  <rect x="3" y="3" width="1174" height="604" rx="26" fill="url(#grid)"/>
  <ellipse cx="180" cy="280" rx="330" ry="300" fill="url(#halo)">
    <animateTransform attributeName="transform" type="translate" values="0 0;35 -12;0 0" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1010" cy="510" rx="280" ry="220" fill="url(#halo)" opacity=".45"/>

  <rect x="24" y="22" width="1132" height="42" rx="13" fill="#FFFFFF" fill-opacity=".72" stroke="#CBD5E1"/>
  <circle cx="48" cy="43" r="5" fill="#FB7185"/>
  <circle cx="66" cy="43" r="5" fill="#FBBF24"/>
  <circle cx="84" cy="43" r="5" fill="#34D399"/>
  <text x="106" y="47" class="mono muted" font-size="12">aakash@profile:~</text>
  <text x="1062" y="47" text-anchor="end" class="mono green" font-size="11">● ONLINE</text>

  <rect x="34" y="82" width="430" height="494" rx="22" fill="#FFFFFF" fill-opacity=".62" stroke="#CBD5E1" filter="url(#shadow)"/>
  <text x="249" y="111" text-anchor="middle" class="mono cyan tiny">VISUAL.MAP</text>
  <line x1="80" y1="126" x2="418" y2="126" stroke="url(#accent)" stroke-opacity=".55"/>

