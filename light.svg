    <text x="249" y="364" fill="#0891B2" opacity=".29">··::++**##%%@@@@@@%%##**++::··</text>
    <text x="249" y="375" fill="#0891B2" opacity=".26">··:::++**##%%%%%%%%##**++:::··</text>
    <text x="249" y="386" fill="#0891B2" opacity=".24">··:::++**############**++:::··</text>
    <text x="249" y="397" fill="#0891B2" opacity=".22">··::::++**########**++::::··</text>
    <text x="249" y="408" fill="#0891B2" opacity=".20">··::::++**########**++::::··</text>
  </g>

  <g class="mono">
